name: Build Foundry module

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out module
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate, test, and stage
        run: npm run build
      - name: Verify tag and manifest versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./module.json').version")"
      - name: Package Foundry module
        run: |
          cd release/cwn-interface-theme
          zip -r ../cwn-interface-theme-${GITHUB_REF_NAME}.zip .
          cp module.json ../module.json
          unzip -t ../cwn-interface-theme-${GITHUB_REF_NAME}.zip
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "module.json"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "scripts/cwn-interface-theme-v082.mjs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "scripts/sheets/cwn-character-sheet-v082.mjs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "scripts/sheets/cwn-npc-sheet-v062.mjs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "scripts/sheets/cwn-drone-sheet-v073.mjs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "styles/cwn-interface-theme-v082.css"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "templates/sheets/character/header-v081.hbs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "templates/sheets/character/combat-v081.hbs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "templates/sheets/character/actions-v080.hbs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "templates/sheets/character/features-v081.hbs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "templates/sheets/character/inventory-v081.hbs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "templates/sheets/character/skills-v082.hbs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "templates/sheets/npc/combat-v062.hbs"
          unzip -Z1 ../cwn-interface-theme-${GITHUB_REF_NAME}.zip | grep -qx "templates/sheets/drone/operations-v070.hbs"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cwn-interface-theme-${{ github.ref_name }}
          path: |
            release/cwn-interface-theme-${{ github.ref_name }}.zip
            release/module.json
      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cwn-interface-theme-${{ github.ref_name }}.zip
            release/module.json
